spring:
  application:
    name: contract-service

  # H2 datasource — used internally by Camunda BPM engine
  datasource:
    url: jdbc:h2:file:./camunda-h2-database;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Disable Spring Boot's JPA auto-config (Camunda manages its own schema)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  # MongoDB — contracts collection
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agiemprestv2}

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: contract-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.projeto_final.workflow.event.LoanRequestedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8082}

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    auto-deployment-enabled: true
    history-level: audit
    database:
      schema-update: true

loan-service:
  url: ${LOAN_SERVICE_URL:http://localhost:8080}

logging:
  level:
    com.projeto_final: DEBUG
    org.camunda: INFO
